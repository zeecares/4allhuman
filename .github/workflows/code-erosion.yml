name: code-erosion
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  erosion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: zeecares/code-erosion@main
        with:
          mode: gate
          threshold: "0.01"
