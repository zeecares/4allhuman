name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write # Required for npm OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Show toolchain versions and OIDC env
        run: |
          node --version
          npm --version
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then echo "OIDC ENV PRESENT"; else echo "OIDC ENV MISSING"; fi

      # Diagnostic: exercise the OIDC exchange npm CLI uses for trusted
      # publishing and print ONLY the error (a successful response contains a
      # short-lived npm token and is masked, these logs are public).
      - name: Diagnose OIDC exchange
        run: |
          OIDC_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          RESP=$(curl -s -X POST https://registry.npmjs.org/-/oidc/exchange -H "Content-Type: application/json" -d "{\"token\": \"$OIDC_TOKEN\"}")
          if echo "$RESP" | jq -e '.token' >/dev/null 2>&1; then echo "EXCHANGE OK (token received, masked)"; else echo "EXCHANGE FAILED:"; echo "$RESP"; fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # No token here: the npm CLI authenticates via OIDC against the trusted
      # publisher configured on npmjs.com for this repo + this workflow file.
      # prepack (tsc build) runs automatically as part of npm publish.
      - name: Publish
        run: npm publish
