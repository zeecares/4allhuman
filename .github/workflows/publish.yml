name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write # Required for npm OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Show toolchain versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # No token here: the npm CLI authenticates via OIDC against the trusted
      # publisher configured on npmjs.com for this repo + this workflow file.
      # prepack (tsc build) runs automatically as part of npm publish.
      - name: Publish
        run: npm publish
